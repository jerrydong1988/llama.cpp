# Dev build: Vulkan + HIP 独立 job，zstd 打包上传 artifacts
# 使用方式: GitHub → Actions → llama-dev-build → Run workflow
name: llama-dev-build (Vulkan & HIP)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / commit to build (default: master)'
        required: false
        default: 'master'
      hip_gpu_targets:
        description: 'HIP GPU targets (comma-separated, e.g. gfx942,gfx1100)'
        required: false
        default: 'gfx942'
      build_type:
        description: 'Build type (Release / RelWithDebInfo / Debug)'
        required: false
        default: 'Release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  LLAMA_LOG_COLORS: 1
  LLAMA_LOG_PREFIX: 1

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Vulkan backend
  # ──────────────────────────────────────────────
  vulkan:
    name: Vulkan (${{ github.event.inputs.build_type || 'Release' }})
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: vulkan-dev-${{ github.event.inputs.build_type || 'Release' }}
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Dependencies
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers libxcb-xinput0 libxcb-xinerama0 libxcb-cursor-dev libssl-dev

      - name: Get latest Vulkan SDK version
        id: vulkan_sdk_version
        run: |
          echo "VULKAN_SDK_VERSION=$(curl https://vulkan.lunarg.com/sdk/latest/linux.txt)" >> "$GITHUB_ENV"

      - name: Use Vulkan SDK Cache
        uses: actions/cache@v5
        id: cache-sdk
        with:
          path: ./vulkan_sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}

      - name: Setup Vulkan SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}

      - name: Build
        id: cmake_build
        run: |
          source ./vulkan_sdk/setup-env.sh
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }} \
            -DGGML_VULKAN=ON \
            -DGGML_NATIVE=OFF
          cmake --build build --config ${{ github.event.inputs.build_type || 'Release' }} -j $(nproc)

      - name: Package artifacts (zstd)
        run: |
          sudo apt-get install -y zstd
          mkdir -p artifacts
          ARTIFACT="llama-vulkan-${{ github.event.inputs.build_type || 'Release' }}-linux-x64"
          mkdir -p "$ARTIFACT"
          # 核心二进制 + 库
          cp -v build/bin/llama-cli       "$ARTIFACT/" 2>/dev/null || true
          cp -v build/bin/llama-server    "$ARTIFACT/" 2>/dev/null || true
          cp -v build/bin/llama-perplex   "$ARTIFACT/" 2>/dev/null || true
          cp -v build/bin/llama-bench     "$ARTIFACT/" 2>/dev/null || true
          cp -v build/lib/libllama.so     "$ARTIFACT/" 2>/dev/null || true
          cp -v build/lib/libggml*.so     "$ARTIFACT/" 2>/dev/null || true
          # 如果没找到 bin/ 目录，试试直接找 build 下的可执行文件
          find build -maxdepth 2 -type f -executable -name 'llama-*' -exec cp {} "$ARTIFACT/" \; 2>/dev/null || true
          find build -maxdepth 2 -name '*.so' -exec cp {} "$ARTIFACT/" \; 2>/dev/null || true
          # 版本信息
          echo "Built from: ${{ github.sha }}" > "$ARTIFACT/BUILD_INFO.txt"
          echo "Backend: Vulkan" >> "$ARTIFACT/BUILD_INFO.txt"
          echo "Build type: ${{ github.event.inputs.build_type || 'Release' }}" >> "$ARTIFACT/BUILD_INFO.txt"
          build/bin/llama-cli --version 2>/dev/null >> "$ARTIFACT/BUILD_INFO.txt" || true
          # zstd 压缩
          tar --zstd -cf artifacts/llama-vulkan.tar.zst "$ARTIFACT"
          echo "Artifact size: $(du -sh artifacts/llama-vulkan.tar.zst | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-vulkan-${{ github.event.inputs.build_type || 'Release' }}
          path: artifacts/llama-vulkan.tar.zst
          retention-days: 7

  # ──────────────────────────────────────────────
  # JOB 2: HIP (AMD ROCm) backend
  # ──────────────────────────────────────────────
  hip:
    name: HIP (${{ github.event.inputs.build_type || 'Release' }})
    runs-on: ubuntu-22.04
    container:
      image: rocm/dev-ubuntu-22.04:7.2.1
    env:
      GPU_TARGETS: ${{ github.event.inputs.hip_gpu_targets || 'gfx942' }}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake rocblas-dev hipblas-dev libssl-dev python3 zstd

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: hip-dev-${{ github.event.inputs.build_type || 'Release' }}-${{ env.GPU_TARGETS }}
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Build
        id: cmake_build
        run: |
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DGPU_TARGETS="${GPU_TARGETS}" \
            -DGGML_HIP=ON \
            -DGGML_HIP_EXPORT_METRICS=Off \
            -DGGML_NATIVE=OFF \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }}
          cmake --build build --config ${{ github.event.inputs.build_type || 'Release' }} -j $(nproc)

      - name: Package artifacts (zstd)
        run: |
          mkdir -p artifacts
          ARTIFACT="llama-hip-${GPU_TARGETS//,/-}-${{ github.event.inputs.build_type || 'Release' }}-linux-x64"
          mkdir -p "$ARTIFACT"
          cp -v build/bin/llama-cli       "$ARTIFACT/" 2>/dev/null || true
          cp -v build/bin/llama-server    "$ARTIFACT/" 2>/dev/null || true
          cp -v build/bin/llama-perplex   "$ARTIFACT/" 2>/dev/null || true
          cp -v build/bin/llama-bench     "$ARTIFACT/" 2>/dev/null || true
          cp -v build/lib/libllama.so     "$ARTIFACT/" 2>/dev/null || true
          cp -v build/lib/libggml*.so     "$ARTIFACT/" 2>/dev/null || true
          find build -maxdepth 2 -type f -executable -name 'llama-*' -exec cp {} "$ARTIFACT/" \; 2>/dev/null || true
          find build -maxdepth 2 -name '*.so' -exec cp {} "$ARTIFACT/" \; 2>/dev/null || true
          echo "Built from: ${{ github.sha }}" > "$ARTIFACT/BUILD_INFO.txt"
          echo "Backend: HIP (AMD)" >> "$ARTIFACT/BUILD_INFO.txt"
          echo "GPU targets: ${GPU_TARGETS}" >> "$ARTIFACT/BUILD_INFO.txt"
          echo "Build type: ${{ github.event.inputs.build_type || 'Release' }}" >> "$ARTIFACT/BUILD_INFO.txt"
          build/bin/llama-cli --version 2>/dev/null >> "$ARTIFACT/BUILD_INFO.txt" || true
          tar --zstd -cf "artifacts/llama-hip-${GPU_TARGETS//,/-}.tar.zst" "$ARTIFACT"
          echo "Artifact size: $(du -sh artifacts/llama-hip-${GPU_TARGETS//,/-}.tar.zst | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-hip-${{ github.event.inputs.hip_gpu_targets || 'gfx942' }}-${{ github.event.inputs.build_type || 'Release' }}
          path: artifacts/llama-hip-*.tar.zst
          retention-days: 7
