name: CI (gfx1151 ROCm 7.13 WMMA)

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'rocm-wmma-tune-gfx1151-ci'
        type: string
      wmma:
        description: 'GGML_HIP_ROCWMMA_FATTN value'
        required: true
        default: 'on'
        type: choice
        options:
          - 'on'
          - 'off'

permissions:
  contents: read

jobs:
  windows-hip-gfx1151:
    name: windows-rocm713-gfx1151-wmma-${{ inputs.wmma }}
    runs-on: windows-2022
    timeout-minutes: 150

    env:
      ROCM_VERSION: '7.13.0'
      ROCM_TARGET_FAMILY: 'gfx1151'
      BUILD_DIR: 'build/hip-gfx1151-wmma-${{ inputs.wmma }}'

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and initialize ROCm 7.13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rocmTarget = Join-Path $env:RUNNER_TEMP 'rocm713'
          New-Item -ItemType Directory -Path $rocmTarget -Force | Out-Null

          Get-PSDrive C | Format-List Name, Used, Free
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --target $rocmTarget `
            "rocm[libraries,devel]==${env:ROCM_VERSION}" `
            --index-url "https://repo.amd.com/rocm/whl/${env:ROCM_TARGET_FAMILY}/"

          $env:PYTHONPATH = $rocmTarget
          $env:ROCM_SDK_TARGET_FAMILY = $env:ROCM_TARGET_FAMILY
          python -m rocm_sdk version
          python -m rocm_sdk init

          $devel = (python -m rocm_sdk path --root).Trim()
          $core = Join-Path $rocmTarget '_rocm_sdk_core'
          $gfx = Join-Path $rocmTarget '_rocm_sdk_libraries_gfx1151'
          $clang = Join-Path $devel 'lib\llvm\bin'
          $deviceLibSource = Join-Path $devel 'lib\llvm\amdgcn\bitcode'
          $deviceLibCompat = Join-Path $devel 'amdgcn\bitcode'

          if (-not (Test-Path -LiteralPath $deviceLibCompat)) {
            if (-not (Test-Path -LiteralPath $deviceLibSource)) {
              throw "ROCm device library not found: $deviceLibSource"
            }
            New-Item -ItemType Junction `
              -Path (Join-Path $devel 'amdgcn') `
              -Target (Join-Path $devel 'lib\llvm\amdgcn') | Out-Null
          }

          $required = @(
            (Join-Path $clang 'clang.exe'),
            (Join-Path $clang 'clang++.exe'),
            $deviceLibCompat,
            (Join-Path $devel 'include\rocwmma\rocwmma.hpp'),
            (Join-Path $gfx 'bin\rocblas\library'),
            (Join-Path $gfx 'bin\hipblaslt\library')
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required ROCm 7.13 path not found: $path"
            }
          }

          & (Join-Path $clang 'clang.exe') --version
          Get-PSDrive C | Format-List Name, Used, Free

          Add-Content -Path $env:GITHUB_ENV -Value "ROCM_PYTHONPATH=$rocmTarget"
          Add-Content -Path $env:GITHUB_ENV -Value "ROCM_DEVEL=$devel"
          Add-Content -Path $env:GITHUB_ENV -Value "ROCM_CORE=$core"
          Add-Content -Path $env:GITHUB_ENV -Value "ROCM_GFX=$gfx"
          Add-Content -Path $env:GITHUB_ENV -Value "ROCM_CLANG=$clang"
          Add-Content -Path $env:GITHUB_ENV -Value "HIP_DEVICE_LIB_PATH=$deviceLibSource"

      - name: Configure and build gfx1151
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ build tools were not found' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          cmd.exe /s /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2])
            }
          }

          $env:PYTHONPATH = $env:ROCM_PYTHONPATH
          $env:ROCM_SDK_TARGET_FAMILY = $env:ROCM_TARGET_FAMILY
          $env:HIP_PLATFORM = 'amd'
          $env:HIP_PATH = $env:ROCM_DEVEL
          $env:ROCM_PATH = $env:ROCM_DEVEL
          $env:PATH = "$env:ROCM_DEVEL\bin;$env:ROCM_CLANG;$env:ROCM_CORE\bin;$env:ROCM_GFX\bin;$env:PATH"
          $wmmaValue = if ('${{ inputs.wmma }}' -eq 'on') { 'ON' } else { 'OFF' }

          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$env:ROCM_CLANG\clang.exe" `
            -DCMAKE_CXX_COMPILER="$env:ROCM_CLANG\clang++.exe" `
            -DCMAKE_PREFIX_PATH="$env:ROCM_DEVEL\lib\cmake" `
            -DCMAKE_HIP_ARCHITECTURES=gfx1151 `
            -DAMDGPU_TARGETS=gfx1151 `
            -DGPU_TARGETS=gfx1151 `
            -DGGML_HIP=ON `
            -DGGML_HIP_ROCWMMA_FATTN=$wmmaValue `
            -DGGML_RPC=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=ON `
            -DGGML_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_CURL=OFF

          cmake --build $env:BUILD_DIR --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Package ROCm 7.13 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:BUILD_DIR 'bin'
          if (-not (Test-Path -LiteralPath $bin)) { throw "Build bin directory not found: $bin" }

          function Copy-RequiredFile([string] $source, [string] $destination) {
            if (-not (Test-Path -LiteralPath $source)) { throw "Required runtime file not found: $source" }
            Copy-Item -LiteralPath $source -Destination $destination -Force
          }

          $coreDlls = @(
            'amdhip64_7.dll',
            'amd_comgr0713.dll',
            'hiprtc07013.dll',
            'hiprtc-builtins07013.dll',
            'rocm_kpack.dll',
            'rocm-openblas.dll',
            'rocm-openblas64.dll'
          )
          foreach ($dll in $coreDlls) {
            Copy-RequiredFile (Join-Path $env:ROCM_DEVEL "bin\$dll") $bin
          }

          $gfxDlls = @(
            'hipblas.dll',
            'libhipblaslt.dll',
            'rocblas.dll',
            'rocsolver.dll',
            'hipsparse.dll',
            'hiprand.dll',
            'rocsparse.dll',
            'rocrand.dll',
            'rocfft.dll'
          )
          foreach ($dll in $gfxDlls) {
            Copy-RequiredFile (Join-Path $env:ROCM_GFX "bin\$dll") $bin
          }

          Copy-RequiredFile 'C:\Windows\System32\libomp140.x86_64.dll' $bin
          Copy-Item -LiteralPath (Join-Path $env:ROCM_GFX 'bin\rocblas') -Destination (Join-Path $bin 'rocblas') -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:ROCM_GFX 'bin\hipblaslt') -Destination (Join-Path $bin 'hipblaslt') -Recurse -Force
          Copy-Item -LiteralPath 'LICENSE' -Destination $bin -Force

          $sourceSha = (git rev-parse HEAD).Trim()
          @"
          source_ref=${{ inputs.source_ref }}
          source_sha=$sourceSha
          rocm_version=${env:ROCM_VERSION}
          hip_arch=gfx1151
          GGML_HIP_ROCWMMA_FATTN=${{ inputs.wmma }}
          "@ | Set-Content -LiteralPath (Join-Path $bin 'build-info.txt') -Encoding UTF8

          & (Join-Path $bin 'llama-cli.exe') --version
          & (Join-Path $bin 'llama-server.exe') --version

          $zip = "llama-bin-win-rocm713-gfx1151-wmma-${{ inputs.wmma }}-${{ github.run_number }}.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          7z a $zip "$bin\*"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_ZIP=$zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-bin-win-rocm713-gfx1151-wmma-${{ inputs.wmma }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error
