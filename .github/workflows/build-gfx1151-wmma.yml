name: CI (gfx1151 WMMA HIP)

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'rocm-wmma-tune-gfx1151-ci'
        type: string
      wmma:
        description: 'GGML_HIP_ROCWMMA_FATTN value'
        required: true
        default: "on"
        type: choice
        options:
          - "on"
          - "off"

permissions:
  contents: read

jobs:
  windows-hip-gfx1151:
    name: windows-hip-gfx1151-wmma-${{ inputs.wmma }}
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      HIPSDK_INSTALLER_VERSION: '25.Q3'
      ROCWMMA_APT_VERSION: '7.0.1'
      ROCWMMA_DEB: 'rocwmma-dev_2.0.0.70001-42~24.04_amd64.deb'
      BUILD_DIR: 'build/hip-gfx1151-wmma-${{ inputs.wmma }}'

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Grab rocWMMA package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -L -o rocwmma.deb "https://repo.radeon.com/rocm/apt/${env:ROCWMMA_APT_VERSION}/pool/main/r/rocwmma-dev/${env:ROCWMMA_DEB}"
          7z x rocwmma.deb
          7z x data.tar

      - name: Cache ROCm installation
        id: cache-rocm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\AMD\ROCm
          key: rocm-${{ env.HIPSDK_INSTALLER_VERSION }}-${{ runner.os }}

      - name: Install ROCm HIP SDK
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Downloading AMD HIP SDK installer'
          Invoke-WebRequest -Uri "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-${env:HIPSDK_INSTALLER_VERSION}-WinSvr2022-For-HIP.exe" -OutFile "${env:RUNNER_TEMP}\rocm-install.exe"
          Write-Host 'Installing AMD HIP SDK'
          $proc = Start-Process "${env:RUNNER_TEMP}\rocm-install.exe" -ArgumentList '-install' -NoNewWindow -PassThru
          $completed = $proc.WaitForExit(600000)
          if (-not $completed) {
            $proc.Kill()
            throw 'ROCm installer timed out after 10 minutes'
          }
          if ($proc.ExitCode -ne 0) {
            throw "ROCm installer failed with exit code $($proc.ExitCode)"
          }

      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clangPath = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clangPath) { throw 'ROCm clang.exe was not found' }
          $env:HIP_PATH = Split-Path (Split-Path $clangPath.FullName)
          $env:ROCM_PATH = $env:HIP_PATH
          $env:CMAKE_PREFIX_PATH = $env:HIP_PATH
          $env:PATH = "$($env:HIP_PATH)\bin;$env:PATH"
          & $clangPath.FullName --version

          $wmmaValue = if ('${{ inputs.wmma }}' -eq 'on') { 'ON' } else { 'OFF' }
          $rocwmmaInclude = "$($PWD.Path.Replace('\', '/'))/opt/rocm-${env:ROCWMMA_APT_VERSION}/include/"

          cmake -G "Unix Makefiles" -B "${env:BUILD_DIR}" -S . `
            -DCMAKE_C_COMPILER="$($env:HIP_PATH)\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$($env:HIP_PATH)\bin\clang++.exe" `
            -DCMAKE_CXX_FLAGS="-I$rocwmmaInclude -Wno-ignored-attributes -Wno-nested-anon-types" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$($env:HIP_PATH)" `
            -DCMAKE_HIP_ARCHITECTURES=gfx1151 `
            -DAMDGPU_TARGETS=gfx1151 `
            -DGPU_TARGETS=gfx1151 `
            -DGGML_HIP=ON `
            -DGGML_HIP_ROCWMMA_FATTN=$wmmaValue `
            -DGGML_RPC=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=ON `
            -DGGML_OPENMP=ON `
            -DGGML_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_CURL=OFF

          cmake --build "${env:BUILD_DIR}" --config Release -j ${env:NUMBER_OF_PROCESSORS}

      - name: Package ROCm runtime and artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clangPath = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clangPath) { throw 'ROCm clang.exe was not found' }
          $hipPath = Split-Path (Split-Path $clangPath.FullName)
          $bin = Join-Path "${env:BUILD_DIR}" 'bin'
          if (-not (Test-Path -LiteralPath $bin)) { throw "Build bin directory not found: $bin" }

          Get-ChildItem -LiteralPath (Join-Path $hipPath 'bin') -Filter '*.dll' | Copy-Item -Destination $bin -Force

          $rocblasLibrary = Join-Path $hipPath 'bin\rocblas\library'
          if (Test-Path -LiteralPath $rocblasLibrary) {
            New-Item -ItemType Directory -Path (Join-Path $bin 'rocblas\library') -Force | Out-Null
            Copy-Item -LiteralPath "$rocblasLibrary\*" -Destination (Join-Path $bin 'rocblas\library') -Force
          } else {
            Write-Warning "rocBLAS kernel directory not found: $rocblasLibrary"
          }

          $hipblasltLibrary = Join-Path $hipPath 'bin\hipblaslt\library'
          if (Test-Path -LiteralPath $hipblasltLibrary) {
            New-Item -ItemType Directory -Path (Join-Path $bin 'hipblaslt\library') -Force | Out-Null
            Copy-Item -LiteralPath "$hipblasltLibrary\*" -Destination (Join-Path $bin 'hipblaslt\library') -Force
          } else {
            Write-Warning "hipBLASLt kernel directory not found: $hipblasltLibrary"
          }

          Copy-Item -LiteralPath 'LICENSE' -Destination $bin -Force


          @"
          source_ref=${{ inputs.source_ref }}
          git_sha=${{ github.sha }}
          hip_arch=gfx1151
          hip_sdk_installer=${env:HIPSDK_INSTALLER_VERSION}
          GGML_HIP_ROCWMMA_FATTN=${{ inputs.wmma }}
          "@ | Set-Content -LiteralPath (Join-Path $bin 'build-info.txt') -Encoding UTF8

          & (Join-Path $bin 'llama-cli.exe') --version

          $zip = "llama-bin-win-hip-gfx1151-wmma-${{ inputs.wmma }}-${{ github.run_number }}.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          7z a $zip "$bin\*"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_ZIP=$zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-bin-win-hip-gfx1151-wmma-${{ inputs.wmma }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error